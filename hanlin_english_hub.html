    <meta name="description" content="國中翰林版英語一至六冊全課次單元特訓總部，每課涵蓋基礎奠基、進階應用、會考挑戰三大難度與完整提示詳解觀念釐清。">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&family=Orbitron:wght@800;900&family=JetBrains+Mono:wght@700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
    <style>
        :root {
            --bg-base: #060b14;
            --bg-card: #0e1726;
            --bg-surface: #17243b;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.3);
            --accent: #60a5fa;
            --gold: #facc15;
            --success: #10b981;
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --font-main: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-display: 'Orbitron', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(96, 165, 250, 0.08) 0%, transparent 50%);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            padding: 30px 20px 60px;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        
        header {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: #bae6fd;
            padding: 8px 16px;
            border-radius: 999px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .btn-back-home:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--primary);
            color: #fff;
            transform: translateX(-2px);
        }

        .badge-main {
            display: inline-block;
            background: rgba(56, 189, 248, 0.12);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 5px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        h1 span { color: var(--gold); }

        p.subtitle {
            color: var(--text-muted);
            font-size: 15px;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 25px 0;
            flex-wrap: wrap;
        }
        .stat-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stat-item .num {
            font-size: 20px;
            font-weight: 900;
            color: var(--gold);
            font-family: var(--font-mono);
        }
        .stat-item .label {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Filter Controls */
        .controls-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }
        .search-input {
            width: 100%;
            background: var(--bg-surface);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 13px 20px 13px 44px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
            font-family: var(--font-main);
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: var(--text-muted);
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: var(--bg-surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-btn:hover {
            color: #fff;
            border-color: var(--primary);
        }
        .filter-btn.active {
            background: var(--primary);
            color: #060b14;
            border-color: var(--primary);
            font-weight: 800;
        }

        /* Modules Grid */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }

        .unit-card {
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .unit-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 20px var(--primary-glow);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .book-pill {
            font-size: 11px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 6px;
            font-family: var(--font-mono);
        }
        .book-b1 { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid #38bdf8; }
        .book-b2 { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; }
        .book-b3 { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid #f59e0b; }
        .book-b4 { background: rgba(217, 70, 239, 0.15); color: #d946ef; border: 1px solid #d946ef; }
        .book-b5 { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 1px solid #f43f5e; }
        .book-b6 { background: rgba(168, 85, 247, 0.15); color: #a855f7; border: 1px solid #a855f7; }

        .unit-num {
            font-size: 12px;
            font-weight: 800;
            color: var(--gold);
            font-family: var(--font-mono);
        }

        .unit-title {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .unit-desc {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .levels-preview {
            background: var(--bg-surface);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 18px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .level-row {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #cbd5e1;
        }

        .btn-launch {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: #060b14;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
        }
        .btn-launch:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .modules-grid { grid-template-columns: 1fr; }
            h1 { font-size: 26px; }
        }
    </style>

        let currentFilter = 'all';
        let searchQuery = '';

        function renderModules() {
            const container = document.getElementById('modulesContainer');
            container.innerHTML = '';

            const filtered = HANLIN_UNITS.filter(u => {
                const matchFilter = currentFilter === 'all' || u.book === currentFilter;
                const matchSearch = searchQuery === '' || 
                    u.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    u.grammar.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    u.keywords.toLowerCase().includes(searchQuery.toLowerCase());
                return matchFilter && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 40px; margin-bottom: 10px;">🔍</div>
                        <p style="font-size: 16px; font-weight: 700;">查無符合條件的翰林英語單元</p>
                        <p style="font-size: 13px; margin-top: 4px;">請嘗試更換搜尋關鍵字或選擇其他冊次分類</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(u => {
                const card = document.createElement('div');
                card.className = 'unit-card';
                card.innerHTML = `
                    <div>
                        <div class="card-top">
                            <span class="book-pill ${u.bookClass}">${u.bookBadge}</span>
                            <span class="unit-num">${u.unit}</span>
                        </div>
                        <h3 class="unit-title">${u.title}</h3>
                        <p class="unit-desc">${u.grammar}</p>
                        <div class="levels-preview">
                            <div class="level-row"><span>🟢</span> <span>Level 1: 基礎奠基 (Foundation) · 5 題</span></div>
                            <div class="level-row"><span>🟡</span> <span>Level 2: 進階應用 (Application) · 5 題</span></div>
                            <div class="level-row"><span>🔴</span> <span>Level 3: 會考挑戰 (Challenge) · 5 題</span></div>
                        </div>
                    </div>
                    <a href="${u.url}" class="btn-launch">
                        <span>⚡ 進入單元特訓 (15 題)</span>
                        <span>➔</span>
                    </a>
                `;
                container.appendChild(card);
            });
        }

        function filterBook(book, btn) {
            currentFilter = book;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderModules();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.trim();
            renderModules();
        }

        // Initial render
        renderModules();
    </script>
